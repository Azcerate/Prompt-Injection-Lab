<!DOCTYPE html>
<html>
<head>
<title>Prompt Injection Lab</title>
</head>
<body>

<h1>Prompt Injection Attack Lab</h1>

<form method="POST">
<textarea name="prompt" rows="6" cols="60"></textarea>
<br><br>
<button type="submit">Submit</button>
</form>

{% if alert %}
<p style="color:red;">{{ alert }}</p>
{% endif %}

{% if bot_response %}
<h3>Response</h3>
<p>{{ bot_response }}</p>
{% endif %}

</body>
</html>
